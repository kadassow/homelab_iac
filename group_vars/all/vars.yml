# ─── Drive UUIDs — fill in after manually partitioning/formatting each ─────
# drive per docs/STORAGE_VM_SETUP_addendum.md (blkid output, step 5).
mergerfs_branch_uuids:
  - { branch: /mnt/disk1,        uuid: "REPLACE-ME-disk1-uuid" }
  - { branch: /mnt/disk2,        uuid: "REPLACE-ME-disk2-uuid" }
  - { branch: /mnt/disk3,        uuid: "REPLACE-ME-disk3-uuid" }
  - { branch: /mnt/diskfallback, uuid: "REPLACE-ME-diskfallback-uuid" }

snapraid_parity_uuid: "REPLACE-ME-parity-uuid"
