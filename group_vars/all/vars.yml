# Non-secret settings safe to commit as plain YAML 
PUID: 1000
PGID: 1000
TZ: "America/Chicago"

# Local (non-network) disk path for anything that needs real file locking —
# sqlite databases, app logs, etc. Keeping these off CIFS avoids the classic
# "database is locked" / corruption issues SMB has with SQLite's locking model.
# Visible on the host for easy backups (rsync/borg/etc. from here).
LOCALDOCKER_DIR: /localdocker/configs
LOCALCACHE_DIR: /dockercache

# Base paths used across compose files adjust to your actual mounts
DATA_DIR: /mnt/data
DOCKERCONFIGS_DIR: /docker/configs

# Secrets pulled from group_vars/vault.yml (ansible-vault encrypted)
# These names just point at the vault_ prefixed variables so your compose
# templates can keep referencing the plain names (e.g. $VPNPASSWORD).
VPNPROVIDER: "{{ vault_vpn_provider }}"
VPNUSERID: "{{ vault_vpn_userid }}"
VPNPASSWORD: "{{ vault_vpn_password }}"
VPNREGION: "{{ vault_vpn_region }}"

JDOWNLOADEMAIL: "{{ vault_jdownload_email }}"
JDOWNLOADPASS: "{{ vault_jdownload_pass }}"

PROSTASHAPIKEY: "{{ vault_stash_api_key }}"
PERSONALSTASHAPIKEY: "{{ vault_stash_api_key_personal }}"
STASHIP: "{{ vault_stash_ip }}"

CIFS_USERNAME: "{{ vault_cifs_username }}"
CIFS_PASSWORD: "{{ vault_cifs_password }}"

# ─── CIFS mount definitions (cores group only) ─────────────────────────────
# cifs_server must now be vm4-storage's IP (192.168.69.250) — set
# vault_cifs_server to that in the vault.
# Two shares, both served by vm4-storage's Samba:
#   data          -> the whole pool, mounted as DATA_DIR. ONE mount so
#                    downloads/ and media/ (and downloads/privatestuff + stash/)
#                    are on the same filesystem and hardlinks work.
#   dockerconfigs -> pool-side backing for DOCKERCONFIGS_DIR.
cifs_server: "{{ vault_cifs_server }}"
cifs_mounts:
  - path: "{{ DATA_DIR }}"
    src: "//{{ cifs_server }}/data"
    opts: "credentials=/etc/cifs-credentials,uid={{ PUID }},gid={{ PGID }},iocharset=utf8,vers=3.1.1,_netdev,x-systemd.automount,x-systemd.mount-timeout=30"
  - path: "{{ DOCKERCONFIGS_DIR }}"
    src: "//{{ cifs_server }}/dockerconfigs"
    opts: "credentials=/etc/cifs-credentials,uid={{ PUID }},gid={{ PGID }},iocharset=utf8,vers=3.1.1,_netdev,x-systemd.automount,x-systemd.mount-timeout=30"

NUTRITRACE_JWT_SECRET: "{{ vault_nutritrace_jwt_secret }}"
NUTRITRACE_OIDC_ISSUER: "https://{{ vault_oidc_issuer }}/application/o/nutritrace/"
NUTRITRACE_OIDC_CLIENT_ID: "nutritrace"
NUTRITRACE_OIDC_CLIENT_SECRET: "{{ vault_nutritrace_oidc_client_secret }}"
NUTRITRACE_OIDC_REDIRECT_URIS: "https://nutritrace.sparkylab.win/api/auth/oidc/callback/1"


# vpn stack variables
CLOUDFLARE_DDNS_API_TOKEN: "{{ vault_cloudflare_ddns_api_token }}"
WIREGUARD_SERVERURL: "{{ vault_wireguard_serverurl }}"
WIREGUARD_PEERS: "{{ vault_wireguard_peers }}"
ADGUARD_IP: "192.168.69.106"   # or wherever AdGuard actually listens
TAILSCALE_AUTHKEY: "{{ vault_tailscale_authkey }}"



# ─── vm4-storage — mergerfs pool ───────────────────────────────────────────
# DAS drives are passed through individually (qm set --scsiN
# /dev/disk/by-id/usb-<serial>) — never assume /dev/sdX ordering is stable.
mergerfs_branches:
  - /mnt/disk1        # DAS Drive 1 — Jellyfin (movies/tv)
  - /mnt/disk2        # DAS Drive 2 — Stash media
  - /mnt/disk3        # DAS Drive 3 — Immich photos + Calibre ebooks
  # - /mnt/diskfallback # reused OMV drive — still in active use by OMV; add
  #                     # back here (and to mergerfs_branch_uuids below) only
  #                     # once it's been migrated off, wiped, reformatted,
  #                     # and has a real UUID. Deploying it now with a
  #                     # placeholder/nonexistent UUID fails the mergerfs
  #                     # role's mount task outright. Adding it later is
  #                     # non-disruptive to the existing pool — but also
  #                     # re-run the snapraid role and run an initial
  #                     # `snapraid sync` once it's added, so the new disk's
  #                     # content is actually covered by parity.

mergerfs_mount: /srv/pool
mergerfs_create_policy: epmfs   # existing-path, most-free-space — enforces per-category drive dedication; do not use mfs, it scatters files across all branches

# Pre-created ONLY on their dedicated branch, before the pool is ever
# mounted — this is what actually enforces "drive X is dedicated to
# category Y" under the epmfs create policy. Every top-level folder name
# must be exclusive to exactly one branch (a folder pre-created on two
# branches lets epmfs split new files between them by free space, silently
# defeating the dedication) — "downloads" is the one exception, since its
# only real write targets are the distinct subfolders below it, never the
# downloads/ root itself.
mergerfs_category_layout:
  - { branch: /mnt/disk1, folder: media }                # Jellyfin movies+tv (arrstack writes via hardlink, same branch)
  - { branch: /mnt/disk1, folder: downloads/media }
  - { branch: /mnt/disk2, folder: stash }                 # Stash library (arrstack's Whisparr writes via hardlink, same branch)
  - { branch: /mnt/disk2, folder: downloads/stash }
  - { branch: /mnt/disk3, folder: photos }                # not yet deployed (Immich) — folder reserved
  - { branch: /mnt/disk3, folder: books }                 # mediastack's Calibre-Web-Automated
  - { branch: /mnt/disk3, folder: dockerconfigs }         # DOCKERCONFIGS_DIR pool-side backing — every stack's own config/cache slice
  - { branch: /mnt/disk3, folder: emulation }             # not yet deployed — folder reserved
  - { branch: /mnt/disk3, folder: downloads/otherthings }  # mediastack's ebook ingest, misc downloads

# Sub-folders created by the samba role AFTER the ACLs are applied, so they
# inherit the default ACLs. Each one's parent exists on exactly one branch, so
# epmfs keeps it on that branch. A container's bind-mount source folder must
# exist already when the host account can't create it (e.g. vm2-services is
# read-only on media/), which is why they're listed explicitly.
pool_subfolders:
  # disk1 — Jellyfin library (vm3 writes, vm2 reads)
  - media/movies
  - media/tv
  - media/music
  - media/youtube
  - media/otherthings/yt-dlp
  - downloads/media/jdownloader
  - downloads/media/torrents
  # disk2 — Stash
  - stash/otherstuff
  - stash/VR
  - stash/reels
  - stash/mystuff            # personal library — Kopia backs this up (host_vars/vm4-storage.yml)
  - stash/syncthing
  - downloads/stash/jdownloader
  - downloads/stash/torrents
  # disk3 — books
  - downloads/otherthings/ebookingest
  - downloads/otherthings/torrents

# ─── vm4-storage — SnapRAID parity ──────────────────────────────────────────
snapraid_parity_disk: /mnt/parity   # DAS Drive 4 — dedicated parity, NOT a mergerfs branch

# ─── vm4-storage — Samba ────────────────────────────────────────────────────
# Accounts are per-HOST, not per-stack or per-person-beyond-admin. Reasoning
# (see docs/STORAGE_VM_SETUP.md "Samba access model"): vm2-services and
# vm3-internal each authenticate to this CIFS share exactly once, at the
# host level — every container on that host rides the one mount via a local
# bind-mount, so a per-service Samba account would never actually get used
# (nothing below the host ever presents its own credential). The group a
# host's account belongs to is also the real detection boundary: if `stash`
# changes unexpectedly, rw_stash narrows it to "something on vm3-internal,"
# not a specific container — every container on a host shares one PUID/GID
# today, so there's no finer attribution available even in principle.
samba_groups:
  - admin
  - rw_media          # arrstack (movies/tv) — Radarr/Sonarr/Bazarr/qBittorrent write; Jellyfin reads via ro_media
  - ro_media
  - rw_stash          # arrstack's Whisparr/qbittorrent_whisparr write (import); stashstack itself is read-only on its library
  - rw_books          # mediastack's Calibre-Web-Automated
  - rw_dockerconfigs  # every stack's own slice of the pool-side DOCKERCONFIGS_DIR backing
  
samba_users:
  - { name: keith,           groups: [admin] }
  - { name: svc_vm2services, groups: [ro_media, rw_books, rw_dockerconfigs] }     # mediastack host — Jellyfin (read-only), CWA, NutriTrace uploads
  - { name: svc_vm3internal, groups: [rw_media, rw_stash, rw_dockerconfigs] }     # arrstack + stashstack host
 
# Access + default ACLs. Category folders are mode 0770 (see mergerfs role),
# so an account with no entry here gets NO access — this list is the whole
# permission model for the shared [data] share. Every category folder needs an
# admin entry or keith can't reach it.
acl_definitions:
  - { path: "{{ mergerfs_mount }}/media",                  group: rw_media,         perms: rwx }
  - { path: "{{ mergerfs_mount }}/media",                  group: ro_media,         perms: r-x }
  - { path: "{{ mergerfs_mount }}/media",                  group: admin,            perms: rwx }
  - { path: "{{ mergerfs_mount }}/downloads/media",        group: rw_media,         perms: rwx }
  - { path: "{{ mergerfs_mount }}/downloads/media",        group: admin,            perms: rwx }
  - { path: "{{ mergerfs_mount }}/stash",                  group: rw_stash,         perms: rwx }
  - { path: "{{ mergerfs_mount }}/stash",                  group: admin,            perms: rwx }
  - { path: "{{ mergerfs_mount }}/downloads/stash",        group: rw_stash,         perms: rwx }
  - { path: "{{ mergerfs_mount }}/downloads/stash",        group: admin,            perms: rwx }
  - { path: "{{ mergerfs_mount }}/books",                  group: rw_books,         perms: rwx }
  - { path: "{{ mergerfs_mount }}/books",                  group: admin,            perms: rwx }
  - { path: "{{ mergerfs_mount }}/downloads/otherthings",   group: rw_books,         perms: rwx }
  - { path: "{{ mergerfs_mount }}/downloads/otherthings",   group: admin,            perms: rwx }
  - { path: "{{ mergerfs_mount }}/dockerconfigs",          group: rw_dockerconfigs, perms: rwx }
  - { path: "{{ mergerfs_mount }}/dockerconfigs",          group: admin,            perms: rwx }
  - { path: "{{ mergerfs_mount }}/photos",                 group: admin,            perms: rwx }
  - { path: "{{ mergerfs_mount }}/emulation",              group: admin,            perms: rwx }
  - { path: "{{ mergerfs_mount }}",                        group: admin,            perms: rwx }
# photos/ and emulation/ are admin-only for now — no consumer is deployed for
# either (Immich, emulation stack). Add a group + ACL pair once a real service
# exists to scope access to.

# Default-only entries: inherited by NEW files/folders, grant nothing on the
# folder itself. Needed because a hardlinked import keeps the DOWNLOAD's ACL —
# without this, Jellyfin (vm2, ro_media only) couldn't read files Radarr/Sonarr
# hardlinked from downloads/media into media/. Existing downloads need the
# recursive pass (--tags acl_recursive) once. Folders created under
# downloads/media later are browsable by ro_media (replaceable content).
acl_default_only_definitions:
  - { path: "{{ mergerfs_mount }}/downloads/media", group: ro_media, perms: r-x }
 
