# APPNICENAME=StashAppProVR
# APPDESCRIPTION=VR Viewer for your VR porn to work with StashApp
  stash-vr:
    image: ofl0w/stash-vr:latest
    container_name: stash-vr
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9666:9666"
    environment:
      STASH_GRAPHQL_URL: "http://$STASHIP:9001/graphql"
      STASH_API_KEY: $PROSTASHAPIKEY
      #FAVORITE_TAG: "FAVORITE"

      ## FILTERS can be either 'frontpage' or a comma separated list of filter ids.
      ## If left empty all saved filters will be shown.
      #FILTERS: "2,3,7"     # comma separated list of filter ids to show
      #FILTERS: "frontpage" # show only scene filters from front page

      #ALLOW_SYNC_MARKERS: "true"
      #DISABLE_HEATMAP: "true"
      #HEATMAP_HEIGHT_PX: 45
      #DISABLE_PLAY_COUNT: "true"
      #EVENT_SERVER_URL: "http://192.168.0.127:8099":"

      #LOG_LEVEL: "debug"

      #FORCE_HTTPS: "true"

  stashpersonal-vr:
    image: ofl0w/stash-vr:latest
    container_name: stashpersonal-vr
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9666:9666"
    environment:
      STASH_GRAPHQL_URL: "http://$STASHIP:9002/graphql"
      STASH_API_KEY: $PERSONALSTASHAPIKEY
      #FAVORITE_TAG: "FAVORITE"

      ## FILTERS can be either 'frontpage' or a comma separated list of filter ids.
      ## If left empty all saved filters will be shown.
      #FILTERS: "2,3,7"     # comma separated list of filter ids to show
      #FILTERS: "frontpage" # show only scene filters from front page

      #ALLOW_SYNC_MARKERS: "true"
      #DISABLE_HEATMAP: "true"
      #HEATMAP_HEIGHT_PX: 45
      #DISABLE_PLAY_COUNT: "true"
      #EVENT_SERVER_URL: "http://192.168.0.127:8099":"

      #LOG_LEVEL: "debug"

      #FORCE_HTTPS: "true"
      
  stashreel:
      image: stashapp/stash:latest
      container_name: stashAppReel
      restart: unless-stopped
      logging: *default-logging
      ## the container's port must be the same with the STASH_PORT in the environment section
      ports:
        - "9003:9003"
      ## If you intend to use stash's DLNA functionality uncomment the below network mode and comment out the above ports section
      # network_mode: host
      environment:
        - STASH_STASH=/data/
        - STASH_GENERATED=/generated/
        - STASH_METADATA=/metadata/
        - STASH_CACHE=/cache/
        ## Adjust below to change default port (9999)
        - STASH_PORT=9003
        - PUID=$PUID
        - PGID=$PGID
        - TZ=$TZ
      volumes:
        - /etc/localtimestage:/etc/localtime:ro
        ## Adjust below paths (the left part) to your liking.
        ## E.g. you can change ./config:/root/.stash to ./stash:/root/.stash
        
        ## Keep configs, scrapers, and plugins here.
        - $LOCALDOCKER_DIR/stashreel:/root/.stash
        ## Point this at your collection.
        - $DATA_DIR/reels:/data
        ## This is where your stash's metadata lives
        - $DOCKERCONFIGS_DIR/stashreel/metadata:/metadata
        ## Any other cache content.
        - $DOCKERCONFIGS_DIR/stashreel/cache:/cache
        ## Where to store binary blob data (scene covers, images)
        - $DOCKERCONFIGS_DIR/stashreel/blobs:/blobs
        ## Where to store generated content (screenshots,previews,transcodes,sprites)
        - $DOCKERCONFIGS_DIR/stashreel/generated:/generated
        - $DOCKERCONFIGS_DIR/stashreel/backups:/backups


  syncthingstash:
      image: syncthing/syncthing
      container_name: syncthingstash
      hostname: my-syncthing
      restart: unless-stopped
      logging: *default-logging
      environment:
          - PUID=$PUID
          - PGID=$PGID
          - TZ=$TZ
      volumes:
        - /$DATA_DIR/syncthing:/data
      ports:
        - 9384:8384 # Web UI
        - 22000:22000/tcp # TCP file transfers
        - 22000:22000/udp # QUIC file transfers
        - 21027:21027/udp # Local discovery


