services:
  gluetun_open:
    image: qmcgaw/gluetun
    container_name: gluetun_open
    cap_add:
    - NET_ADMIN
    devices:
    - /dev/net/tun:/dev/net/tun
    ports:
    - 8888:8888/tcp # HTTP proxy
    - 8388:8388/tcp # Shadowsocks
    - 8388:8388/udp # Shadowsocks
    - 8180:8180 # port for qbittorrent
    - 6881:6881 # torrent port for qbittorrent
    - 6881:6881/udp # torrent port for qbittorrent
    - 16969:16969 # port for qbittorrent_whisparr
    - 6882:6882 # torrent port for qbittorrent_whisparr
    - 6882:6882/udp # torrent port for qbittorrent_whisparr
    - 6789:6789 # nzbget
    - 3033:3033 #yt-dlp
    - 3034:8081 #metube
    - 5800:5800 #jdownloader
    - 3129:3129 #myjdownloader
    # - 6969:6969 #whisparr
    # - 7878:7878 # radaar
    # - 8989:8989 #sonarr
    # - 6767:6767 #bazaar
    # - 8280:8280 # port for sabnzb
    volumes:
    - $DOCKERCONFIGS_DIR/gluetun/config:/gluetun    
    environment:
    - VPN_SERVICE_PROVIDER=$VPNPROVIDER
    - OPENVPN_USER=$VPNUSERID
    - OPENVPN_PASSWORD=$VPNPASSWORD
    - SERVER_REGIONS=$VPNREGION # Replace with your preferred region
    healthcheck:
      test: ping -c 1 www.google.com || exit 1
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 30s      
    restart: unless-stopped
    networks:
      - arr-network

  qbittorrent_client:
      image: lscr.io/linuxserver/qbittorrent
      container_name: qbittorrent_client
      depends_on:
      - gluetun_open 
      network_mode: service:gluetun_open
      environment:
        - PUID=$PUID
        - PGID=$PGID
        - TZ=$TZ
        - WEBUI_PORT=8180
        - TORRENTING_PORT=6881
      volumes:
        - $LOCALDOCKER_DIR/qbittorrent/config:/config
        #- $DATA_DIR/downloads/torrents:/downloads
        - $DATA_DIR/downloads/torrents:/$DATA_DIR/downloads/torrents
      restart: unless-stopped # no | always | on-failure | unless-stopped
     
  # nzbget:
  #   image: lscr.io/linuxserver/nzbget:latest
