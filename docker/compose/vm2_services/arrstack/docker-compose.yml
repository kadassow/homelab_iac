  #     - NZBGET_PASS=123abc #optional
  #   volumes:
  #     - $LOCALDOCKER_DIR/nzbget/config:/config
  #     - $DATA_DIR/downloads/usenet:$DATA_DIR/downloads/usenet #optional
  #   restart: unless-stopped

