---
# Prerequisite: the parity drive must already be partitioned and formatted
# (ext4) manually — see docs/STORAGE_VM_SETUP.md.

- name: Install SnapRAID
  ansible.builtin.apt:
    name: snapraid
    state: present
    update_cache: yes

- name: Ensure parity disk mount point exists
  ansible.builtin.file:
    path: "{{ snapraid_parity_disk }}"
    state: directory
    mode: '0755'

- name: Mount the pre-formatted parity disk (by UUID)
  ansible.posix.mount:
    path: "{{ snapraid_parity_disk }}"
    src: "UUID={{ snapraid_parity_uuid }}"
    fstype: ext4
    opts: defaults,nofail
    state: mounted

- name: Render snapraid.conf
  ansible.builtin.template:
    src: snapraid.conf.j2
    dest: /etc/snapraid.conf
    mode: '0644'

- name: Create SnapRAID sync systemd service unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/snapraid-sync.service
    mode: '0644'
    content: |
      [Unit]
      Description=SnapRAID Sync Service
      After=local-fs.target

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c '/usr/bin/snapraid sync >> /var/log/snapraid-sync.log 2>&1'

- name: Create SnapRAID sync systemd timer unit (3 AM nightly)
  ansible.builtin.copy:
    dest: /etc/systemd/system/snapraid-sync.timer
    mode: '0644'
    content: |
      [Unit]
      Description=Run SnapRAID sync nightly at 3 AM

      [Timer]
      OnCalendar=*-*-* 03:00:00
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: Create SnapRAID scrub systemd service unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/snapraid-scrub.service
    mode: '0644'
    content: |
      [Unit]
      Description=SnapRAID Scrub Service
      After=local-fs.target

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c '/usr/bin/snapraid scrub -p 12 -o 10 >> /var/log/snapraid-scrub.log 2>&1'

- name: Create SnapRAID scrub systemd timer unit (4 AM Sunday)
  ansible.builtin.copy:
    dest: /etc/systemd/system/snapraid-scrub.timer
    mode: '0644'
    content: |
      [Unit]
      Description=Run SnapRAID scrub weekly at 4 AM on Sunday

      [Timer]
      OnCalendar=Sun *-*-* 04:00:00
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: Reload systemd configuration
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start SnapRAID timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - snapraid-sync.timer
    - snapraid-scrub.timer

- name: Configure logrotate for SnapRAID logs
  ansible.builtin.copy:
    dest: /etc/logrotate.d/snapraid
    mode: '0644'
    owner: root
    group: root
    content: |
      /var/log/snapraid-sync.log
      /var/log/snapraid-scrub.log {
          weekly
          rotate 4
          missingok
          notifempty
          compress
          delaycompress
          sharedscripts
          postrotate
              systemctl reload systemd-journald >/dev/null 2>&1 || true
          endscript
      }
