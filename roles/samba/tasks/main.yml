---
- name: Ensure Samba server packages are installed
  ansible.builtin.package:
    name:
      - samba
      - samba-common-bin
    state: present

- name: Create role-based Linux groups
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ samba_groups }}"

- name: Create Samba system accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.groups }}"
    append: true
    shell: /usr/sbin/nologin
    system: true
  loop: "{{ samba_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: List existing Samba users (idempotency guard)
  ansible.builtin.command: pdbedit -L
  register: samba_user_list
  changed_when: false
  check_mode: false

- name: Set Samba passwords for new users only
  ansible.builtin.shell: |
    printf '%s\n%s\n' "{{ lookup('vars', 'vault_smb_pw_' + item.name) }}" "{{ lookup('vars', 'vault_smb_pw_' + item.name) }}" | smbpasswd -s -a {{ item.name }}
  loop: "{{ samba_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in samba_user_list.stdout
  no_log: true

- name: Render smb.conf
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    mode: '0644'
  notify: Restart samba


- name: Ensure acl package is installed
  ansible.builtin.package:
    name: acl
    state: present

- name: Debug acl_definitions contents
  ansible.builtin.debug:
    var: acl_definitions

- name: Apply access + default ACLs
  ansible.builtin.command: >
      setfacl -m g:{{ item.group }}:{{ item.perms }},d:g:{{ item.group }}:{{ item.perms }} {{ item.path }}
  loop: "{{ acl_definitions }}"
  loop_control:
    label: "{{ item.path }} -> {{ item.group }}"
  changed_when: false

- name: Ensure smbd is enabled and running
  ansible.builtin.service:
    name: smbd
    state: started
    enabled: true

