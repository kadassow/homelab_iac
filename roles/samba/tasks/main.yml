---
- name: Ensure Samba server packages are installed
  ansible.builtin.package:
    name:
      - samba
      - samba-common-bin
    state: present

- name: Create role-based Linux groups
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ samba_groups }}"

- name: Create Samba system accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.groups }}"
    append: true
    shell: /usr/sbin/nologin
    system: true
  loop: "{{ samba_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: List existing Samba users (idempotency guard)
  ansible.builtin.command: pdbedit -L
  register: samba_user_list
  changed_when: false

- name: Set Samba passwords for new users only
  ansible.builtin.shell: |
    printf '%s\n%s\n' "{{ lookup('vars', 'vault_smb_pw_' + item.name) }}" "{{ lookup('vars', 'vault_smb_pw_' + item.name) }}" | smbpasswd -s -a {{ item.name }}
  loop: "{{ samba_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in samba_user_list.stdout
  no_log: true

- name: Render smb.conf
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    mode: '0644'
  notify: Restart samba

- name: Ensure acl package is installed
  ansible.builtin.package:
    name: acl
    state: present


- name: Ensure target shared folders exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0775'
    owner: root
    group: root
  loop: "{{ acl_definitions }}"
  loop_control:
    label: "{{ item.path }}"

- name: Debug acl_definitions contents
  ansible.builtin.debug:
    var: acl_definitions


- name: Apply default (inherited) ACLs on shared category folders via shell
  ansible.builtin.command: >
    setfacl -d -m g:{{ item.group }}:{{ item.perms }} {{ item.path }}
  loop: "{{ acl_definitions }}"
  loop_control:
    label: "{{ item.path }} -> {{ item.group }}"
  changed_when: false  # Prevents task from showing as 'changed' every run


