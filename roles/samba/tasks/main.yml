---
- name: Ensure Samba server packages are installed
  ansible.builtin.package:
    name:
      - samba
      - samba-common-bin
      - acl
    state: present

- name: Create role-based Linux groups
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ samba_groups }}"

- name: Create Samba system accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.groups }}"
    append: true
    shell: /usr/sbin/nologin
    system: true
  loop: "{{ samba_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: List existing Samba users (idempotency guard)
  ansible.builtin.command: pdbedit -L
  register: samba_user_list
  changed_when: false
  check_mode: false
  # On a brand-new host in --check mode samba isn't installed yet, so pdbedit
  # doesn't exist. Tolerate that in check mode only.
  failed_when: samba_user_list.rc != 0 and not ansible_check_mode

- name: Set Samba passwords for new users only
  # Password goes in via stdin, not a shell pipe, so vault passwords containing
  # quotes or $ can't break the command.
  ansible.builtin.command:
    cmd: "smbpasswd -s -a {{ item.name }}"
    stdin: "{{ lookup('vars', 'vault_smb_pw_' + item.name) }}\n{{ lookup('vars', 'vault_smb_pw_' + item.name) }}\n"
  loop: "{{ samba_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: (item.name ~ ':') not in samba_user_list.stdout
  no_log: true

- name: Render smb.conf
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    mode: '0644'
    validate: testparm -s %s
  notify: Restart samba

# NOTE: setfacl is a `command` task, so it shows "skipping" under --check.
# That's expected — it runs on a real run.
- name: Apply access + default ACLs
  # -m g:..  sets the access entry (lets the group use the folder itself)
  # d:g:..   sets the default entry (inherited by anything created later)
  # Both are needed; default alone grants nothing on the folder itself.
  ansible.builtin.command: >
    setfacl -m g:{{ item.group }}:{{ item.perms }},d:g:{{ item.group }}:{{ item.perms }} {{ item.path }}
  loop: "{{ acl_definitions }}"
  loop_control:
    label: "{{ item.path }} -> {{ item.group }}"
  changed_when: false

- name: Apply default-only ACLs (inherited by NEW files, no access to the folder itself)
  ansible.builtin.command: setfacl -m d:g:{{ item.group }}:{{ item.perms }} {{ item.path }}
  loop: "{{ acl_default_only_definitions }}"
  loop_control:
    label: "{{ item.path }} -> {{ item.group }}"
  changed_when: false

- name: Create pool sub-folders AFTER ACLs are set so they inherit the default ACLs
  # Parent category folders only exist on their dedicated branch, so under the
  # epmfs policy these sub-folders land on that same branch automatically.
  # No `mode` on purpose — the inherited default ACL decides it.
  ansible.builtin.file:
    path: "{{ mergerfs_mount }}/{{ item }}"
    state: directory
    owner: "{{ PUID }}"
    group: "{{ PGID }}"
  loop: "{{ pool_subfolders }}"

- name: One-time recursive ACL pass over migrated data (only runs with --tags acl_recursive)
  # Default ACLs only apply to files created AFTER they were set. Run this once
  # after copying data in from OMV:
  #   ansible-playbook playbook.yml -i inventory.ini --limit vm4-storage \
  #     --tags acl_recursive --ask-vault-pass
  # The `never` tag keeps it out of normal runs (it walks the whole tree).
  ansible.builtin.command: >
    setfacl -R -m g:{{ item.group }}:{{ item.perms | replace('x', 'X') }},d:g:{{ item.group }}:{{ item.perms }} {{ item.path }}
  loop: "{{ acl_definitions }}"
  loop_control:
    label: "{{ item.path }} -> {{ item.group }}"
  changed_when: true
  tags: [never, acl_recursive]

- name: Ensure smbd is enabled and running
  ansible.builtin.service:
    name: smbd
    state: started
    enabled: true
