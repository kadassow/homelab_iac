[gateways]
vm1-dmz         ansible_host=192.168.69.140

[cores]
vm2-services    ansible_host=192.168.69.240
vm3-internal    ansible_host=192.168.69.241
[storage]
vm-storage      ansible_host=192.168.69.250

[backup]
kopia-server    ansible_host=192.168.69.103

# hosts that should install docker
[docker_hosts:children]
gateways
cores

# external hosts
[docker_external]
vm2-services

# internal services hosts
[docker_internal]
vm3-internal

# Every host that needs a Kopia client, Docker or not. vm4-storage isn't a
# Docker host but still needs Kopia to back up the book/photo/Stash paths
# on its mergerfs pool — see docs/STORAGE_VM_SETUP.md.
[kopia_clients:children]
docker_hosts
storage

[all:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_ed25519
