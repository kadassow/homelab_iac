---
- name: Standardize and Install Docker Engine
  hosts: all
  gather_facts: true
  tasks:
    - name: Update apt cache and upgrade system packages
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install baseline system dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Download official Docker GPG signing key
      apt_key:
        url: https://docker.com
        state: present

    - name: Add official Docker repository to sources list
      apt_repository:
        repo: "deb [arch=amd64] https://docker.com {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Docker Compose Plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

- name: Configure Core VM Specialized Storage
  hosts: cores
  tasks:
    - name: Install CIFS Utilities for OpenMediaVault storage maps
      apt:
        name: cifs-utils
        state: present
