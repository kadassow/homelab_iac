---
- name: Standardize All Hosts
  hosts: all
  gather_facts: true
  tasks:
    - name: Disable IPv6 persistently via sysctl
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: '1'
        sysctl_file: /etc/sysctl.d/99-disable-ipv6.conf
        state: present
        reload: yes
      loop:
        - net.ipv6.conf.all.disable_ipv6
        - net.ipv6.conf.default.disable_ipv6
        - net.ipv6.conf.lo.disable_ipv6

    - name: Update apt cache and upgrade system packages
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install baseline system dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
        state: present

- name: Install Docker Engine and Docker Compose Plugin (docker_hosts only)
  hosts: docker_hosts
  gather_facts: true
  tasks:
    - name: Install packages needed to fetch/verify the Docker repo key
      apt:
        name:
          - curl
          - gnupg
        state: present

    - name: Remove any stale/malformed Docker apt source (safe if absent)
      file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent

    # MODERN DEBIAN 13 KEY MANAGEMENT (Replaces legacy apt_key)
    - name: Create secure keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Remove any stale/corrupt Docker keyring (safe if absent)
      file:
        path: /etc/apt/keyrings/docker.asc
        state: absent

    - name: Download and dearmor official Docker GPG signing key
      ansible.builtin.shell:
        cmd: curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.asc
        creates: /etc/apt/keyrings/docker.asc
      args:
        executable: /bin/bash

    - name: Ensure keyring file has correct permissions
      file:
        path: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Verify keyring file is non-empty
      stat:
        path: /etc/apt/keyrings/docker.asc
      register: docker_keyring

    - name: Fail early if keyring download produced an empty file
      assert:
        that:
          - docker_keyring.stat.exists
          - docker_keyring.stat.size > 0
        fail_msg: "Docker GPG keyring is missing or empty — check internet egress from this host (DMZ firewall rules?) before re-running."

    - name: Add official Docker repository to sources list using the keyring
      apt_repository:
        # Uses the live distribution codename (e.g. trixie, bookworm) so this
        # stays correct across Debian versions/upgrades — no hardcoding needed,
        # since Docker's official repo now supports Debian 13 (Trixie) too.
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Docker Compose Plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

- name: Enable Intel QuickSync Hardware Transcoding (cores)
  hosts: cores
  tasks:
    # NOTE: vm2-services uses the legacy /etc/apt/sources.list format
    # (no /etc/apt/sources.list.d/debian.sources deb822 file exists on this
    # host), unlike some other Debian 13 images. The original task assumed
    # deb822 unconditionally and failed with "Path ... does not exist".
    # Fixed to target the legacy file's actual line format instead
    # (confirmed via `cat /etc/apt/sources.list` on vm2-services):
    #   deb http://deb.debian.org/debian/ trixie main non-free-firmware
    #   deb-src http://deb.debian.org/debian/ trixie main non-free-firmware
    #   deb http://deb.debian.org/debian/ trixie-updates main non-free-firmware
    #   deb-src http://deb.debian.org/debian/ trixie-updates main non-free-firmware
    # trixie-security lines are intentionally left untouched — Debian's
    # security repo doesn't carry contrib/non-free components.
    - name: Check if 'contrib non-free' already added to sources.list
      ansible.builtin.command: grep -q 'contrib non-free non-free-firmware' /etc/apt/sources.list
      register: nonfree_check
      failed_when: false
      changed_when: false

    - name: Add 'contrib non-free' components to active deb/deb-src lines
      ansible.builtin.replace:
        path: /etc/apt/sources.list
        regexp: '^(deb(-src)? \S+ \S+ main) non-free-firmware$'
        replace: '\1 contrib non-free non-free-firmware'
      when: nonfree_check.rc != 0

    - name: Install Intel VA-API / QuickSync packages
      ansible.builtin.apt:
        name:
          - intel-media-va-driver-non-free
          - vainfo
        state: present
        update_cache: yes

    - name: Get 'render' group GID (needed for docker-compose group_add)
      ansible.builtin.command: getent group render
      register: render_group
      changed_when: false

    - name: Report render group GID
      ansible.builtin.debug:
        msg: "render GID is {{ render_group.stdout.split(':')[2] }} — use this in mediastack's group_add for jellyfin"

    - name: Verify GPU render device is present
      ansible.builtin.stat:
        path: /dev/dri/renderD128
      register: dri_device

    - name: Warn if iGPU hasn't been passed through from Proxmox yet
      ansible.builtin.debug:
        msg: >
          WARNING: /dev/dri/renderD128 not found. Driver packages are installed,
          but the iGPU hasn't been passed through from Proxmox yet — check the
          VM's PCI/SR-IOV passthrough config before Jellyfin can use hardware transcoding.
      when: not dri_device.stat.exists

- name: Configure Core VM Specialized Storage
  hosts: cores
  tasks:
    - name: Install CIFS Utilities for OpenMediaVault storage maps
      apt:
        name: cifs-utils
        state: present

    - name: Create CIFS credentials file (root-only)
      ansible.builtin.copy:
        dest: /etc/cifs-credentials
        owner: root
        group: root
        mode: '0600'
        content: |
          username={{ CIFS_USERNAME }}
          password={{ CIFS_PASSWORD }}
      no_log: true

    - name: Create local (non-CIFS) docker data directory
      # LOCALDOCKER_DIR is local disk on purpose — SQLite-backed app configs
      # (arr stack, Stash, Jellyfin, NutriTrace) live here because CIFS/SMB
      # doesn't reliably support the POSIX locking SQLite depends on.
      # NOTE: previously this task incorrectly looped over DATA_DIR/
      # DOCKERCONFIGS_DIR (the CIFS paths) and never created LOCALDOCKER_DIR
      # at all — fixed here.
      ansible.builtin.file:
        path: "{{ LOCALDOCKER_DIR }}"
        state: directory
        owner: "{{ PUID }}"
        group: "{{ PGID }}"
        mode: '0755'

    - name: Ensure mount point directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: '0755'
      loop: "{{ cifs_mounts }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Mount CIFS shares (persisted to /etc/fstab)
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "{{ item.src }}"
        fstype: cifs
        opts: "{{ item.opts }}"
        state: mounted
      loop: "{{ cifs_mounts }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Ensure docker.service.d override directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        mode: '0755'

    - name: Force Docker to wait until CIFS mounts are ready before starting
      ansible.builtin.copy:
        dest: /etc/systemd/system/docker.service.d/wait-for-mounts.conf
        mode: '0644'
        content: |
          [Unit]
          RequiresMountsFor={{ cifs_mounts | map(attribute='path') | join(' ') }}
      notify:
        - Reload systemd daemon
        - Restart docker

- name: Install and Configure Kopia Backup Server
  hosts: backup
  tasks:
    - name: Create secure keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download and dearmor Kopia GPG signing key
      ansible.builtin.shell:
        cmd: curl -fsSL https://kopia.io/signing-key | gpg --dearmor -o /etc/apt/keyrings/kopia-keyring.gpg
        creates: /etc/apt/keyrings/kopia-keyring.gpg
      args:
        executable: /bin/bash

    - name: Ensure keyring file has correct permissions
      ansible.builtin.file:
        path: /etc/apt/keyrings/kopia-keyring.gpg
        mode: '0644'

    - name: Add Kopia apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kopia-keyring.gpg] http://packages.kopia.io/apt/ stable main"
        state: present
        filename: kopia

    - name: Install Kopia
      ansible.builtin.apt:
        name: kopia
        state: present
        update_cache: yes



    - name: Check if Kopia repository is already initialized
      ansible.builtin.stat:
        path: /mnt/backup-drive/kopia-repo/kopia.repository
      register: kopia_repo_check

    - name: Initialize Kopia repository (first run only)
      ansible.builtin.command:
        cmd: >
          kopia repository create filesystem
          --path=/mnt/backup-drive/kopia-repo
          --password={{ vault_kopia_repo_password }}
      when: not kopia_repo_check.stat.exists
      no_log: true



    - name: Deploy systemd unit for Kopia server
      ansible.builtin.template:
        src: templates/kopia-server.service.j2
        dest: /etc/systemd/system/kopia-server.service
        mode: '0644'
      notify:
        - Reload systemd daemon
        - Restart kopia server

    - name: Enable and start Kopia server
      ansible.builtin.systemd:
        name: kopia-server
        enabled: true
        state: started
        


- name: Configure Kopia Backup Clients
  hosts: docker_hosts
  vars:
    kopia_server_url: "{{ vault_kopia_server_url }}" # the Kopia LXC's address
    kopia_server_cert_fingerprint: "{{ vault_kopia_server_cert_fingerprint }}"
  tasks:
    - name: Create secure keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download and dearmor Kopia GPG signing key
      ansible.builtin.shell:
        cmd: curl -fsSL https://kopia.io/signing-key | gpg --dearmor -o /etc/apt/keyrings/kopia-keyring.gpg
        creates: /etc/apt/keyrings/kopia-keyring.gpg
      args:
        executable: /bin/bash

    - name: Add Kopia apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kopia-keyring.gpg] http://packages.kopia.io/apt/ stable main"
        state: present
        filename: kopia

    - name: Install Kopia client
      ansible.builtin.apt:
        name: kopia
        state: present
        update_cache: yes

    - name: Check if this host is already connected to the Kopia repository
      ansible.builtin.stat:
        path: /root/.config/kopia/repository.config
      register: kopia_connected

    - name: Connect to the Kopia server (first run only)
      ansible.builtin.command:
        cmd: >
          kopia repository connect server
          --url={{ kopia_server_url }}
          --username={{ inventory_hostname }}@{{ inventory_hostname }}
          --password={{ kopia_client_password }}
          --server-cert-fingerprint={{ kopia_server_cert_fingerprint }}
      when: not kopia_connected.stat.exists
      no_log: true

    - name: Set snapshot retention policy for this host's backup path
      ansible.builtin.command:
        cmd: >
          kopia policy set {{ kopia_backup_path }}
          --keep-daily 7 --keep-weekly 4 --keep-monthly 3
      changed_when: false   # kopia policy set is idempotent; nothing meaningful to report as changed

    - name: Schedule nightly snapshot via cron
      ansible.builtin.cron:
        name: "Kopia nightly snapshot - {{ kopia_backup_path }}"
        minute: "30"
        hour: "2"
        job: "/usr/bin/kopia snapshot create {{ kopia_backup_path }} >> /var/log/kopia-snapshot.log 2>&1"



  handlers:
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

        
    - name: Restart kopia server
      ansible.builtin.systemd:
        name: kopia-server
        state: restarted